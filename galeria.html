<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería · Daniel Guevara</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,900&family=Raleway:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#1a1a1f;--dark2:#22222a;--dark3:#2c2c36;
  --red:#e03030;--aqua:#3ecfb8;--aqua-dim:#2aab97;
  --text:#e8e8ec;--muted:#8888a0;--border:rgba(255,255,255,0.08);
}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--text);font-family:'Raleway',sans-serif;font-weight:300;overflow-x:hidden}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(26,26,31,0.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2.5rem;height:60px;
}
.nav-logo{font-family:'Raleway',sans-serif;font-weight:200;font-size:18px;letter-spacing:3px;color:var(--text);text-decoration:none}
.nav-logo span{font-family:'Playfair Display',serif;font-weight:700;font-style:italic;color:var(--aqua)}
.nav-back{
  color:var(--muted);text-decoration:none;font-size:12px;font-weight:500;
  letter-spacing:1.5px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;transition:color 0.2s;
}
.nav-back:hover{color:var(--aqua)}
.nav-back svg{transition:transform 0.2s}
.nav-back:hover svg{transform:translateX(-3px)}

/* HERO */
.hero{
  padding:120px 2.5rem 3rem;
  position:relative;overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 50% 40% at 90% 20%, rgba(62,207,184,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 30% 40% at 5% 90%, rgba(224,48,48,0.05) 0%, transparent 60%);
}
.hero-content{position:relative;z-index:1;max-width:700px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:4px;text-transform:uppercase;color:var(--aqua);margin-bottom:1rem;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:24px;height:1px;background:var(--aqua)}
h1{font-size:clamp(36px,5vw,58px);line-height:1.1;margin-bottom:1rem}
.h1-thin{font-family:'Raleway',sans-serif;font-weight:200;letter-spacing:6px;display:block}
.h1-bold{font-family:'Playfair Display',serif;font-weight:900;font-style:italic;color:var(--aqua);display:block}
.hero-sub{color:var(--muted);font-size:15px;max-width:480px;line-height:1.7}

/* FILTER */
.filter-wrap{
  padding:0 2.5rem 2rem;
  display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:60px;z-index:50;
  background:rgba(26,26,31,0.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding-top:1rem;padding-bottom:1rem;
}
.f-btn{
  background:transparent;border:1px solid var(--border);
  color:var(--muted);font-family:'Raleway',sans-serif;
  font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;
  padding:6px 16px;cursor:pointer;transition:all 0.15s;
}
.f-btn:hover{border-color:var(--aqua);color:var(--aqua)}
.f-btn.active{background:var(--red);border-color:var(--red);color:#fff}

/* GRID */
.gallery-wrap{padding:2rem 2.5rem 4rem}
.masonry{
  columns:3;column-gap:12px;
}
@media(max-width:900px){.masonry{columns:2}}
@media(max-width:560px){.masonry{columns:1}}

.g-item{
  break-inside:avoid;
  margin-bottom:12px;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  border:1px solid var(--border);
  transition:border-color 0.2s,transform 0.2s;
}
.g-item:hover{border-color:var(--aqua);transform:translateY(-3px);box-shadow:0 16px 48px rgba(0,0,0,0.5)}
.g-item img{
  width:100%;display:block;
  transition:transform 0.4s ease;
}
.g-item:hover img{transform:scale(1.03)}

.g-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top, rgba(26,26,31,0.95) 0%, rgba(26,26,31,0.2) 50%, transparent 100%);
  opacity:0;transition:opacity 0.25s;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:1.25rem;
}
.g-item:hover .g-overlay{opacity:1}
.g-area{font-size:10px;color:var(--aqua);letter-spacing:2px;text-transform:uppercase;font-weight:500;margin-bottom:4px}
.g-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--text);line-height:1.2}
.g-desc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}

.g-accent{
  position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--red);opacity:0;transition:opacity 0.2s;
}
.g-item:hover .g-accent{opacity:1}

.g-badge{
  position:absolute;top:10px;right:10px;
  background:rgba(62,207,184,0.15);
  border:1px solid rgba(62,207,184,0.35);
  color:var(--aqua);font-size:9px;font-weight:700;
  padding:3px 8px;letter-spacing:0.5px;
  backdrop-filter:blur(4px);
}

/* LIGHTBOX */
.lb{
  position:fixed;inset:0;z-index:200;
  background:rgba(10,10,14,0.97);
  display:none;align-items:center;justify-content:center;
  padding:2rem;
}
.lb.open{display:flex}
.lb-inner{
  position:relative;max-width:1100px;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:1rem;
}
.lb-img{
  max-height:80vh;max-width:100%;
  border:1px solid var(--border);
  box-shadow:0 30px 80px rgba(0,0,0,0.8);
  display:block;
}
.lb-info{text-align:center}
.lb-area{font-size:11px;color:var(--aqua);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.lb-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;font-style:italic}
.lb-desc{font-size:13px;color:var(--muted);margin-top:4px}
.lb-close{
  position:absolute;top:-1rem;right:0;
  width:36px;height:36px;
  background:var(--red);border:none;
  color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.15s;
}
.lb-close:hover{background:var(--aqua)}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(26,26,31,0.8);border:1px solid var(--border);
  color:var(--text);font-size:20px;cursor:pointer;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  transition:border-color 0.15s,color 0.15s;
}
.lb-nav:hover{border-color:var(--aqua);color:var(--aqua)}
.lb-prev{left:-56px}
.lb-next{right:-56px}

@media(max-width:700px){
  .lb-prev{left:0;bottom:-60px;top:auto;transform:none}
  .lb-next{right:0;bottom:-60px;top:auto;transform:none}
}

/* FOOTER */
footer{
  background:var(--dark2);border-top:1px solid var(--border);
  padding:1.5rem 2.5rem;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;
}
.f-brand{font-family:'Raleway',sans-serif;font-weight:200;font-size:14px;letter-spacing:3px;color:var(--muted)}
.f-brand span{font-family:'Playfair Display',serif;font-style:italic;color:var(--aqua)}
.f-dot{width:6px;height:6px;background:var(--red);border-radius:50%;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.fade-in{opacity:0;transform:translateY(20px);transition:opacity 0.5s,transform 0.5s}
.fade-in.visible{opacity:1;transform:translateY(0)}

/* empty state */
.empty{text-align:center;padding:4rem 2rem;color:var(--muted);font-size:15px;display:none}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">daniel <span>Guevara</span></a>
  <a href="index.html" class="nav-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Volver al portafolio
  </a>
</nav>

<div class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <div class="eyebrow fade-in">Portafolio visual</div>
    <h1 class="fade-in" style="transition-delay:0.1s">
      <span class="h1-thin">Galería de</span>
      <span class="h1-bold">Proyectos</span>
    </h1>
    <p class="hero-sub fade-in" style="transition-delay:0.2s">Capturas reales de apps construidas y funcionando en producción. Cada imagen es un problema resuelto.</p>
  </div>
</div>

<div class="filter-wrap">
  <button class="f-btn active" onclick="filterGallery('all',this)">Todas</button>
  <button class="f-btn" onclick="filterGallery('ventas',this)">Ventas</button>
  <button class="f-btn" onclick="filterGallery('logistica',this)">Logística</button>
  <button class="f-btn" onclick="filterGallery('operaciones',this)">Operaciones</button>
  <button class="f-btn" onclick="filterGallery('marketing',this)">Marketing</button>
  <button class="f-btn" onclick="filterGallery('talento',this)">Talento</button>
</div>

<div class="gallery-wrap">
  <div class="masonry" id="gallery"></div>
  <div class="empty" id="empty">No hay proyectos en esta categoría aún.</div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb" onclick="closeLB(event)">
  <div class="lb-inner">
    <button class="lb-close" onclick="closeLB()">✕</button>
    <button class="lb-nav lb-prev" onclick="navLB(-1,event)">‹</button>
    <img class="lb-img" id="lb-img" src="" alt="">
    <button class="lb-nav lb-next" onclick="navLB(1,event)">›</button>
    <div class="lb-info">
      <div class="lb-area" id="lb-area"></div>
      <div class="lb-name" id="lb-name"></div>
      <div class="lb-desc" id="lb-desc"></div>
    </div>
  </div>
</div>

<footer>
  <div class="f-brand">daniel <span>Guevara</span> · Soluciones Digitales</div>
  <div style="font-size:12px;color:var(--muted)"><span class="f-dot"></span>Colombia 2026</div>
</footer>

<script>
const projects = [
  {
    area:'ventas', areaLabel:'Ventas',
    name:'Central de Llamadas',
    desc:'CRM ligero con 9.532 contactos, historial y estados por consultora.',
    img:'cap-llamadas.png'
  },
  {
    area:'logistica', areaLabel:'Logística',
    name:'Rastreo de Guías',
    desc:'Carga masiva desde Excel, rastreo Interrapidísimo e Interservice.',
    img:'cap-guias.png'
  },
  {
    area:'marketing', areaLabel:'Marketing',
    name:'Mailer Masivo',
    desc:'914 correos enviados. Plantilla HTML + métricas en tiempo real.',
    img:'cap-mailer.png'
  },
  {
    area:'operaciones', areaLabel:'Operaciones',
    name:'Banco de Lentes',
    desc:'Inventario con trazabilidad, flujo de trabajo y actividad reciente.',
    img:'cap-banco-lentes.png'
  },
  {
    area:'talento', areaLabel:'Talento',
    name:'Portal del Empleado',
    desc:'Intranet unificada con acceso a todos los aplicativos por área.',
    img:'cap-portal.png'
  },
  {
    area:'talento', areaLabel:'Inteligencia',
    name:'Centro de Inteligencia',
    desc:'$642M en ventas enero 2026. Comparativos mensuales y exportables.',
    img:'cap-data.png'
  },
  {
    area:'operaciones', areaLabel:'Operaciones',
    name:'POS Personalizado — Café',
    desc:'Sistema de pedidos por mesa, barra o llevar con dashboard de ventas.',
    img:'cap-pos2.png'
  },
  {
    area:'marketing', areaLabel:'Digital',
    name:'App de Barrio — Soy del Parche',
    desc:'App hiperlocal: cupones, muro comunitario, tiendas y actividades.',
    img:'cap-barrio.png'
  },
];

let activeFilter = 'all';
let currentIdx = 0;
let visibleProjects = [];

function filterGallery(area, btn) {
  activeFilter = area;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGallery();
}

function renderGallery() {
  const grid = document.getElementById('gallery');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  visibleProjects = activeFilter === 'all' ? projects : projects.filter(p => p.area === activeFilter);

  if (visibleProjects.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  visibleProjects.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'g-item fade-in';
    item.style.transitionDelay = (i * 0.06) + 's';
    item.innerHTML = `
      <div class="g-accent"></div>
      <img src="${p.img}" alt="${p.name}" loading="lazy">
      <div class="g-overlay">
        <div class="g-area">${p.areaLabel}</div>
        <div class="g-name">${p.name}</div>
        <div class="g-desc">${p.desc}</div>
      </div>
      <div class="g-badge">✓ En producción</div>
    `;
    item.addEventListener('click', () => openLB(i));
    grid.appendChild(item);
    setTimeout(() => item.classList.add('visible'), 50 + i * 60);
  });
}

function openLB(idx) {
  currentIdx = idx;
  const p = visibleProjects[idx];
  document.getElementById('lb-img').src = p.img;
  document.getElementById('lb-area').textContent = p.areaLabel;
  document.getElementById('lb-name').textContent = p.name;
  document.getElementById('lb-desc').textContent = p.desc;
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLB(e) {
  if (e && e.target !== document.getElementById('lb') && !e.target.classList.contains('lb-close')) return;
  if (!e) {
    document.getElementById('lb').classList.remove('open');
    document.body.style.overflow = '';
  } else {
    document.getElementById('lb').classList.remove('open');
    document.body.style.overflow = '';
  }
}

function navLB(dir, e) {
  if (e) e.stopPropagation();
  currentIdx = (currentIdx + dir + visibleProjects.length) % visibleProjects.length;
  const p = visibleProjects[currentIdx];
  const img = document.getElementById('lb-img');
  img.style.opacity = '0';
  setTimeout(() => {
    img.src = p.img;
    document.getElementById('lb-area').textContent = p.areaLabel;
    document.getElementById('lb-name').textContent = p.name;
    document.getElementById('lb-desc').textContent = p.desc;
    img.style.opacity = '1';
  }, 150);
  img.style.transition = 'opacity 0.15s';
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowRight') navLB(1);
  if (e.key === 'ArrowLeft') navLB(-1);
});

const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, {threshold: 0.1});
document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));

renderGallery();
</script>
</body>
</html>
